name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Checked before anything is built, so a mismatch costs seconds rather than two runners and
  # a half-published release. The tag is the version users will see; gradle/libs.versions.toml
  # is the version compiled into both apps. If those disagree, the stores get a build labelled
  # differently from the tag it came from, and there is no way to tell afterwards which is
  # wrong.
  verify-version:
    name: Verify version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag must match appVersion, and the changelog must mention it
        id: check
        run: |
          set -eu

          # Fails closed. A workflow_dispatch from a branch has no tag, and publishing
          # "refs/heads/main" to a store is not recoverable. Dispatching from a tag ref is
          # still allowed, and is the supported way to re-run a failed release.
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "::error::release.yml must run from a tag, not $GITHUB_REF"; exit 1 ;;
          esac

          DECLARED=$(sed -nE 's/^appVersion[[:space:]]*=[[:space:]]*"(.*)"/\1/p' gradle/libs.versions.toml)
          test -n "$DECLARED" || { echo "::error::appVersion not found in gradle/libs.versions.toml"; exit 1; }

          if [ "$GITHUB_REF_NAME" != "$DECLARED" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match appVersion $DECLARED -- bump the catalog and retag"
            exit 1
          fi

          # A release with no changelog entry is one nobody can read afterwards. Cheap to
          # check here, impossible to add once the build is on a store.
          BARE="${DECLARED#v}"
          grep -q "^## \[$BARE\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$BARE]' section"; exit 1; }

          echo "version=$DECLARED" >> "$GITHUB_OUTPUT"
          echo "tag $GITHUB_REF_NAME matches appVersion $DECLARED"

  android:
    name: Android
    needs: verify-version
    runs-on: ubuntu-24.04
    # Normalised to booleans at job level: a step's own `env:` is not in scope for its own
    # `if:`, so checking the secret inside the step that defines it would never fire.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}

      # Written to a file rather than passed inline: Gradle's signing config wants a path, and
      # a base64 secret echoed into a command line would land in the process table.
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/halotap.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/halotap.keystore" >> "$GITHUB_ENV"

      - name: Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :wearApp:bundleRelease :androidApp:bundleRelease

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundles
          path: "*/build/outputs/bundle/release/*.aab"
          if-no-files-found: error

      # Skipped rather than failed when no credentials exist, so that tagging works before the
      # Play listing does. The notice makes the skip visible: a release that quietly published
      # nothing would be worse than one that refused.
      - name: Publish to Play
        if: env.HAS_PLAY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          export PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play.json"
          gem install bundler --no-document
          bundle install
          bundle exec fastlane android play

      - name: Note skipped publish
        if: env.HAS_PLAY != 'true'
        run: echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so nothing was published to Play. The bundles are attached to this run."

  apple:
    name: Apple Watch
    needs: verify-version
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
      HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          chmod +x gradlew
          ./gradlew generateWatchVersionConfig
          cd watchApp && xcodegen generate

      # Unsigned unless a certificate is available, which keeps a tag push useful before the
      # Apple Developer account exists: it still proves the release configuration archives.
      - name: Import signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/halotap.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/halotap.mobileprovision

          echo "SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -eu
          cd watchApp
          if [ "${SIGNING_AVAILABLE:-}" = "true" ]; then
            xcodebuild -project watchApp.xcodeproj -scheme Halotap \
              -configuration Release -sdk watchos -archivePath "$RUNNER_TEMP/Halotap.xcarchive" archive
          else
            echo "::notice::no signing certificate configured; archiving unsigned"
            xcodebuild -project watchApp.xcodeproj -target Halotap \
              -configuration Release -sdk watchos ARCHS=arm64_32 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          fi

      - name: Publish to App Store Connect
        if: env.HAS_ASC_KEY == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          gem install bundler --no-document
          bundle install
          bundle exec fastlane ios appstore

      - name: Note skipped publish
        if: env.HAS_ASC_KEY != 'true'
        run: echo "::notice::APP_STORE_CONNECT_KEY_P8 is not set, so nothing was uploaded to App Store Connect."

  github-release:
    name: GitHub release
    needs: [verify-version, android, apple]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          name: android-release-bundles
          path: artifacts

      # The notes come from CHANGELOG.md rather than being written twice. verify-version
      # already proved the section exists.
      - name: Extract release notes
        run: |
          BARE="${GITHUB_REF_NAME#v}"
          awk -v v="$BARE" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: artifacts/**/*.aab
          fail_on_unmatched_files: false
