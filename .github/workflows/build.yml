name: Build

on:
  # No paths-ignore here, deliberately. `build` is a required status check on main, and a
  # workflow that a path filter skips never reports it at all -- the check sits "Expected"
  # forever and the pull request can never merge. So the workflow always starts, and the
  # `changes` job below decides whether there is anything worth building.
  pull_request:
    branches: [main]
  # A path filter is safe here: nothing requires a check on a push, so a docs-only push to
  # main simply does not run, and the badge keeps showing the last real result.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
  # Called by release.yml, so a tag is verified by exactly the same suite that gates a pull
  # request rather than by a copy of it that is free to drift. A release used to build and
  # publish without running a single test.
  workflow_call:

concurrency:
  # Deliberately not derived from github.workflow. When release.yml calls this workflow,
  # github.workflow is the *caller's* name, so the two would land in one group and the
  # cancel below could abort the release that started this run.
  group: build-${{ github.ref }}
  # Only a pull request is worth superseding. A push to main, and above all a release
  # verification, has to run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether this change can affect a build at all.
  #
  # Replaces the path filter that used to sit on the pull_request trigger. Filtering at the
  # trigger meant a docs-only pull request produced no run, no `build` check, and no way to
  # merge. Filtering here keeps the saving -- a README edit still skips the macOS runner and
  # the Android emulator -- while `build` always reports.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history, so the merge base with the target branch exists to diff against.
          fetch-depth: 0

      - name: Decide whether anything but documentation changed
        id: filter
        run: |
          set -eu

          # Only a pull request is filtered. A push, a manual run, and a release all build
          # everything: those are not places to be clever about saving minutes.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "event is ${{ github.event_name }}; building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          echo "changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Anything that is not documentation counts as code. Inverted deliberately: an
          # unrecognised path builds, so a new kind of file is never skipped by accident.
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^LICENSE$|^\.gitignore$|^$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only; the build jobs will be skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The shared state machine is the only thing both watches depend on, so it is worth
  # proving on its own before either app is built. It runs on the JVM here rather than on a
  # simulator: the logic takes time as a parameter and touches no platform API, so a native
  # run would cost minutes of Kotlin/Native linking to assert exactly the same things. The
  # Apple job below still compiles it for every watchOS architecture.
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew :sharedLogic:testAndroidHostTest

      # detekt covers the Kotlin that Android lint never sees -- commonMain and watchosMain.
      # Android lint covers manifest and API-level problems detekt knows nothing about.
      # They do not overlap, so both run.
      - name: Detekt
        run: ./gradlew detekt

      - name: Android lint
        run: ./gradlew :wearApp:lintDebug :androidApp:lintDebug

  # Both Android apps, on Linux. Assembling is the real check here: the Wear manifest has to
  # merge with the watch-only uses-feature intact, and the two APKs must not collide on
  # versionCode, which they would if the +1 in wearApp/build.gradle.kts were ever dropped.
  android:
    name: Android
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble
        run: |
          chmod +x gradlew
          ./gradlew :wearApp:assembleDebug :androidApp:assembleDebug

      # A Wear APK that lost its watch-only marker would be offered to phones, and two APKs
      # sharing a versionCode are rejected by Play at upload rather than at build. Neither
      # failure is visible in a green assemble, so assert both.
      - name: Verify Wear packaging
        run: |
          set -eu
          manifest=$(find wearApp/build/intermediates/merged_manifests -name AndroidManifest.xml | head -1)
          test -n "$manifest" || { echo "::error::no merged Wear manifest"; exit 1; }

          grep -q 'android.hardware.type.watch' "$manifest" \
            || { echo "::error::Wear APK lost its watch-only uses-feature"; exit 1; }
          grep -q 'wearable.standalone' "$manifest" \
            || { echo "::error::Wear APK is no longer marked standalone"; exit 1; }

          phone=$(find androidApp/build/intermediates/merged_manifests -name AndroidManifest.xml | head -1)
          wear_code=$(grep -oE 'versionCode="[0-9]+"' "$manifest" | head -1)
          phone_code=$(grep -oE 'versionCode="[0-9]+"' "$phone" | head -1)
          echo "wear=$wear_code phone=$phone_code"
          test "$wear_code" != "$phone_code" \
            || { echo "::error::Wear and phone APKs share a versionCode; Play will reject the release"; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            wearApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The Android Keystore and the SMS send path have no JVM equivalent -- there is no real
  # keystore to encrypt against and no radio to report back -- so these only run on a device.
  # They are the tests covering the code most likely to fail in a user's hand.
  android-device:
    name: Android device tests
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}

      # KVM has to be enabled explicitly or the emulator falls back to software rendering
      # and takes long enough to time the job out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A Wear image, not a phone one: :wearApp declares uses-feature watch as required, so
      # a phone emulator would refuse to install it.
      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          script: make test-device

  # Apple Silicon runner, so the simulator target is watchosSimulatorArm64. Note this differs
  # from a local Intel build, which needs watchosX64 -- the Makefile derives it from uname,
  # and the mismatch is exactly why that logic exists.
  apple:
    name: Apple Watch
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Kotlin/Native downloads a toolchain and prebuilt klibs per target on first use, which
      # dominates this job's runtime if it is not cached.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run the shared tests on a real watchOS target
        run: |
          chmod +x gradlew
          ./gradlew :sharedLogic:watchosSimulatorArm64Test

      # Every device slice, not just the simulator one. A framework that compiles for the
      # simulator can still fail for arm64_32, and finding that out at release time rather
      # than here would mean a failed upload instead of a failed pull request.
      - name: Compile every watchOS architecture
        run: |
          ./gradlew \
            :sharedLogic:compileKotlinWatchosArm64 \
            :sharedLogic:compileKotlinWatchosDeviceArm64 \
            :sharedLogic:compileKotlinWatchosSimulatorArm64

      - name: Install xcodegen
        run: brew install xcodegen

      # xcodebuild needs a simulator runtime matching its watchOS SDK, or every invocation
      # fails with "Found no destinations". Runner images do not always ship one.
      - name: Ensure a watchOS runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q watchOS; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes | grep watchOS

      # Regenerates the Xcode project from project.yml, which is what is under version
      # control, and writes Version.xcconfig from the version catalog first. Building here
      # proves the generated project is buildable from a clean checkout -- the thing that
      # would otherwise only be discovered by a contributor cloning the repo.
      #
      # Signed ad-hoc, exactly as the Makefile does. CODE_SIGNING_ALLOWED=NO strips
      # entitlements, and without a keychain access group every settings save fails with
      # errSecMissingEntitlement -- so the app silently cannot store a PIN. CI used to build
      # it that way and pass, which is worse than not building it at all.
      - name: Build the watch app
        run: make watch-build

      # The suite that caught the entitlement bug. Without it CI could approve exactly the
      # regression it was written to prevent.
      - name: Watch tests
        run: make test-watch

      # The whole point of the shared module is that the watch app really links it. A UI that
      # compiled but dropped the framework would still produce a green build.
      - name: Verify the shared framework is linked in
        run: |
          set -eu
          app=$(find watchApp/build -name "Halotap.app" -maxdepth 6 | head -1)
          test -n "$app" || { echo "::error::no Halotap.app was produced"; exit 1; }

          # Both binaries, because a Debug build is split in two from Xcode 15 on: the .app's
          # own binary is a ~40KB launcher stub and every symbol lives in Halotap.debug.dylib.
          # Scanning only the first found nothing and failed a correctly linked build.
          if nm "$app/Halotap" "$app/Halotap.debug.dylib" 2>/dev/null | grep -q -i "StandbySession"; then
            echo "shared logic is linked into the watch binary"
          else
            echo "::error::SharedLogic symbols are missing; the watch app is not linked against it"
            exit 1
          fi

  # One stable required status for the branch ruleset. The matrix-free jobs above each report
  # their own context, so requiring them individually would mean editing the ruleset whenever
  # a job is added or renamed. if: always() is required, or this is skipped rather than failed
  # when something upstream fails.
  build-gate:
    name: build
    needs: [changes, test, android, android-device, apple]
    # Required, so it has to report on every pull request without exception -- including one
    # whose build jobs were skipped as documentation-only, and one where something upstream
    # failed. Without always() it would be skipped rather than failed, and a skipped required
    # check blocks the merge forever instead of reporting red.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have succeeded or been skipped
        run: |
          set -eu

          # `changes` is held to a higher standard than the rest: it decides whether the
          # others were allowed to skip, so it failing must never read as "nothing to build".
          echo "changes:        ${{ needs.changes.result }} (code=${{ needs.changes.outputs.code }})"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::the changes job did not succeed, so nothing can be trusted to have been skipped on purpose"
            exit 1
          fi

          failed=0
          for pair in \
            "test:${{ needs.test.result }}" \
            "android:${{ needs.android.result }}" \
            "android-device:${{ needs.android-device.result }}" \
            "apple:${{ needs.apple.result }}"; do
            name=${pair%%:*}
            result=${pair#*:}
            printf '%-15s %s\n' "$name:" "$result"
            # Skipped is a pass only because `changes` already succeeded above, which means
            # the skip was a deliberate documentation-only decision rather than a collapse.
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::build-gate failed"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.code }}" = "true" ]; then
            echo "All required jobs succeeded"
          else
            echo "Documentation only; no build was required"
          fi
