name: watchApp
options:
  bundleIdPrefix: com.halotap.app
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "11.0"

configs:
  Debug: debug
  Release: release

targets:
  Halotap:
    type: application
    platform: watchOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Halotap
        # CFBundleShortVersionString and CFBundleVersion come from MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION in the generated Version.xcconfig, so they are not set here.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A watch-only app: no iPhone companion is required to install or run it.
        WKApplication: true
        WKWatchOnly: true
    # Generated by `./gradlew generateWatchVersionConfig` from appVersion in the version
    # catalog. `make watch-project` runs that first; so does CI.
    configFiles:
      Debug: Configuration/Version.xcconfig
      Release: Configuration/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halotap.app.watch
        # Without this, Xcode derives platforms from SDKROOT alone and refuses every
        # simulator destination as ineligible.
        SUPPORTED_PLATFORMS: watchos watchsimulator
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        # sharedLogic builds a *static* framework, so it is linked, never embedded. The
        # pre-build script drops exactly one slice here, so one search path always matches.
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/build/kotlin-framework
        OTHER_LDFLAGS:
          - -framework
          - SharedLogic
    preBuildScripts:
      - name: Build Kotlin framework for watchOS
        basedOnDependencyAnalysis: false
        path: Scripts/build-kotlin-framework.sh

  # The Swift side had no tests at all, which meant the Keychain holding the user's PIN and
  # emergency contacts was covered by nothing but having run the app once.
  HalotapTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Tests
    dependencies:
      - target: Halotap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halotap.app.watch.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: watchos watchsimulator

# xcodegen generates a build-only scheme by default; the test action has to be declared or
# `xcodebuild test` reports the scheme is not configured for it.
schemes:
  Halotap:
    build:
      targets:
        Halotap: all
        HalotapTests: [test]
    test:
      targets:
        - HalotapTests
